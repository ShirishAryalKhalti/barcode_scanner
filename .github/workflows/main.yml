name: Build Flutter Example (Debug)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Manual clone and checkout
        run: |
          rm -rf repo
          git clone https://github.com/${{ github.repository }}.git repo
          cd repo

      - name: Run flutter build (debug)
        run: |
          cd repo/example
          flutter build apk --debug
